            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === stages.length - 1;

            let conceptsHtml = s.concepts.map(c => `
                <div class="p-4 rounded-2xl bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">
                    <h3 class="font-bold text-emerald-600 dark:text-emerald-400 text-sm mb-1 font-heading"><i class="fa-solid fa-atom mr-2"></i>${c.title}</h3>
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">${c.desc}</p>
                </div>
            `).join('');

            let resourcesHtml = s.resources.map(r => `
                <a href="${r.url}" target="_blank" class="p-4 rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 hover:border-emerald-500 transition-all group flex flex-col justify-between shadow-sm">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${r.type}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-emerald-500 transition-colors"></i>
                        </div>
                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm group-hover:text-emerald-600 transition-colors mb-1 font-heading">${r.name}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">${r.desc}</p>
                    </div>
                </a>
            `).join('');

            document.getElementById('stageCard').innerHTML = `
                <div class="space-y-8">
                    <div>
                        <p class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed">${s.subtitle}</p>
                    </div>

                    <div>
                        <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">Conceptos Clave de la Etapa</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${conceptsHtml}
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">${s.widgetTitle}</h3>
                        ${s.widgetHtml}
                    </div>

                    <div>
                        <h3 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-3">Recursos Libres y Gratuitos Recomendados</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${resourcesHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        function switchStage(idx) { 
            renderStage(idx); 
        }

        function navigateStage(dir) {
            const n = currentStage + dir;
            if (n >= 0 && n < stages.length) {
                renderStage(n);
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const icon = document.getElementById('darkModeIcon');
            icon.className = html.classList.contains('dark') ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        // Lógica interactiva Etapa 1 (Fotón)
        function triggerPhotonLab() {
            const line = document.getElementById('laserBeamLine');
            const detector = document.getElementById('photonDetector');
            const txt = document.getElementById('photonStatusText');
            
            line.style.opacity = '1';
            detector.innerHTML = "⚡ Colapsando...";
            detector.className = "text-xl font-bold text-amber-400 animate-pulse";
            txt.innerText = "Calculando estados de superposición óptica...";

            setTimeout(() => {
                line.style.opacity = '0.3';
                const outcome = Math.random() > 0.5 ? "|1⟩ (Camino Superior)" : "|0⟩ (Camino Inferior)";
                detector.innerHTML = outcome;
                detector.className = "text-sm font-bold font-mono text-emerald-400";
                txt.innerText = `¡Fotón medido con éxito! El estado superpuesto colapsó en el detector: ${outcome}`;
            }, 900);
        }

        // Lógica interactiva Etapa 2 (Circuitos)
        let circuitGates = [];
        function applyGate(gate) {
            if (circuitGates.length >= 4) {
                circuitGates.shift();
            }
            circuitGates.push(gate);
            updateCircuitView();
        }
        function resetCircuit() {
            circuitGates = [];
            updateCircuitView();
        }
        function updateCircuitView() {
            const slots = document.getElementById('circuitSlots');
            const vector = document.getElementById('currentStateVector');
            const bar = document.getElementById('probBar0');
            const probText = document.getElementById('probText');
            const log = document.getElementById('circuitLog');

            let html = `<span class="px-2.5 py-1 bg-slate-900 border border-slate-700 rounded-lg text-xs font-mono text-slate-400">|0⟩</span>`;
            circuitGates.forEach(g => {
                let color = g === 'H' ? 'bg-purple-950 text-purple-300 border-purple-700' : 'bg-teal-950 text-teal-300 border-teal-700';
                html += `<span class="px-3 py-1 rounded-lg text-xs font-mono font-bold border ${color}">[ ${g} ]</span>`;
            });
            slots.innerHTML = html;

            if (circuitGates.length === 0) {
                vector.innerText = "|ψ⟩ = 1.00 |0⟩ + 0.00 |1⟩";
                bar.style.width = "100%";
                probText.innerText = "|0⟩: 100%";
                log.innerText = "Estado del circuito: En estado base inicial |0⟩.";
            } else {
                const last = circuitGates[circuitGates.length - 1];
                if (last === 'H') {
                    vector.innerText = "|ψ⟩ = 0.71 |0⟩ + 0.71 |1⟩";
                    bar.style.width = "50%";
                    probText.innerText = "50% / 50%";
                    log.innerText = "Compuerta Hadamard aplicada: Se generó superposición cuántica equitativa.";
                } else {
                    vector.innerText = "|ψ⟩ = 0.00 |0⟩ + 1.00 |1⟩";
                    bar.style.width = "0%";
                    probText.innerText = "|1⟩: 100%";
                    log.innerText = "Compuerta Pauli-X aplicada: Inversión de estado completada (|1⟩).";
                }
            }
        }

        // Lógica interactiva Etapa 3 (Cloud SDK)
        function runCloudSdkJob() {
            const consoleBox = document.getElementById('sdkConsoleOutput');
            const status = document.getElementById('sdkStatusBadge');
            
            status.innerText = "Estado: Compilando y ejecutando en QPU Cloud...";
            consoleBox.innerHTML = `<span class="text-amber-400 animate-pulse">⚙️ Transpilando circuito para QPU superconductora...</span>`;

            setTimeout(() => {
                consoleBox.innerHTML = `
                    <div class="space-y-1">
                        <div class="text-emerald-400">✓ Job ID: #qjob-8849-ae21</div>
                        <div class="text-slate-300">✓ Shots ejecutados: 1024 iteraciones en simulador aer.</div>
                        <div class="text-purple-300 font-bold mt-2">Histograma de resultados devuelto:</div>
                        <div class="font-mono text-xs text-slate-300 mt-1">|00⟩: 508 counts (49.6%) &nbsp; |11⟩: 516 counts (50.4%)</div>
                    </div>
                `;
                status.innerText = "Estado: Job completado con éxito (Resultados OK)";
            }, 1200);
        }

        // Lógica interactiva Etapa 4 (PQC Migration)
        function executePqcMigration() {
            const badgeRsa = document.getElementById('badgeRsa');
            const timeRsa = document.getElementById('timeRsa');
            const statusPqc = document.getElementById('statusPqcText');
            const logBox = document.getElementById('pqcLogBox');
            const btn = document.getElementById('pqcBtn');

            badgeRsa.className = "px-2.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800";
            badgeRsa.innerText = "Blindado con PQC";
            timeRsa.className = "text-emerald-400 font-bold";
            timeRsa.innerText = "Inmune a Algoritmo de Shor";
            statusPqc.innerText = "Infraestructura Segura y Protegida";
            logBox.innerHTML = "<span class='text-emerald-400'>✓ Migración completada: Canales corporativos actualizados a estándares reticulares NIST PQC.</span>";
            btn.innerText = "Blindaje Activo ✓";
            btn.className = "px-5 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow transition-all";
        }

        window.onload = () => renderStage(0);
    </script>
</body>
</html>
